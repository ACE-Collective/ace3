<script type="text/javascript">
    $('#action_{{action.name}}_{{unique_reference}}').on('click', function() {
        aceApi.post("/integrations/example/alerts/{{alert.uuid}}/observables/{{_observable.uuid}}/example")
            .then(function(result) { alert(JSON.stringify(result)); })
            .catch(function(err) { alert("Action failed: " + err.message); });
    });
</script>
