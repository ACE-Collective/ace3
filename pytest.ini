[pytest]
testpaths = tests
addopts = --strict-markers -m "unit or integration or system"
markers =
    unit
    integration
    system
    functional
    subcutaneous
    slow
filterwarnings =
    ignore:::ldap3[.*]
    # ACE forks engine workers deliberately (saq/environment.py ACE_MP_CONTEXT); moving
    # off fork is a separate design change
    ignore:This process \(pid=\d+\) is multi-threaded, use of fork\(\) may lead to deadlocks:DeprecationWarning
    # third-party deprecations we cannot fix (latest releases still emit them)
    ignore::DeprecationWarning:oletools\..*
    ignore::DeprecationWarning:tld\..*
    ignore::DeprecationWarning:lark\..*
    ignore::DeprecationWarning:flask_login\..*
