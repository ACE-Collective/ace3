[pytest]
# every integration under integrations/, at any depth; pytest_ignore_collect in tests/harness.py keeps
# collection there inside the integration directories
testpaths = tests integrations
pythonpath = .
# names a test module by its path from the checkout root (integrations.<name>.tests.test_x), so an
# integration's tests package does not collide with core's tests package or with another's
consider_namespace_packages = true
addopts = --strict-markers -m "unit or integration or system"
asyncio_default_fixture_loop_scope = function
markers =
    unit
    integration
    system
    functional
    subcutaneous
    slow
filterwarnings =
    ignore:::ldap3[.*]
    # ACE forks engine workers deliberately (saq/environment.py ACE_MP_CONTEXT); moving
    # off fork is a separate design change
    ignore:This process \(pid=\d+\) is multi-threaded, use of fork\(\) may lead to deadlocks:DeprecationWarning
    # third-party deprecations we cannot fix (latest releases still emit them)
    ignore::DeprecationWarning:oletools\..*
    ignore::DeprecationWarning:tld\..*
    ignore::DeprecationWarning:lark\..*
    ignore::DeprecationWarning:flask_login\..*
