
#
# .env variables
#
#
# these set the default output docker image tags
#
# ACE3_IMAGE_URL
# ACE3_PHISHKIT_MANAGER_IMAGE_URL
# ACE3_PHISHKIT_IMAGE_URL
# ACE3_JS_DEOBFUSCATOR_MANAGER_IMAGE_URL
# ACE3_JS_DEOBFUSCATOR_IMAGE_URL
#
# this allows you to pull every third party base image from somewhere other than docker hub
# useful if you are using some kind of a pass through docker image registry
#
# DOCKER_IMAGE_PREFIX (default: docker.io)
#
# it is the registry prefix only, with no trailing slash -- everything up to but not
# including the repository path. the image name and version tag stay in this file and in
# the Dockerfiles so that upstream controls them, e.g.
#
#   DOCKER_IMAGE_PREFIX=123456789012.dkr.ecr.us-east-2.amazonaws.com/dockerhub
#
# yields 123456789012.dkr.ecr.us-east-2.amazonaws.com/dockerhub/library/mysql:9.7
#
# password and configuration settings
# NOTE if these are not set they are auto-generated
#
# SAQ_ENC (primary encryption password)
# ACE_API_KEY (api key for node-to-node communication)
# ACE_DB_USER_PASSWORD (password for the ace-user database user)
# ACE_SUPERUSER_DB_USER_PASSWORD (password for the ace-superuser database user)
# REDIS_PASSWORD
# RABBITMQ_PASSWORD
# QDRANT_API_KEY
# FLASK_SECRET_KEY (used by flask to encrypt and verify session data)
#
# host name overrides if services are running on different hosts
# ACE_DB_HOST
# ACE_DB_READONLY_HOST
# RABBITMQ_HOSTNAME
# REDIS_HOSTNAME
# QDRANT_HOSTNAME
#
# configuration options
# SAQ_CONFIG_PATHS
# SAQ_USER_ID
# SAQ_GROUP_ID
#
# BUILD_TYPE: development | production (default: development)
#
# more than one ACE instance on the same host -- see docs/MULTI_INSTANCE.md
# ACE_INSTANCE (default: ace)
# ACE_INSTANCE_NAME (default: DEV)
# ACE_GUI_BASE_URI
# ACE_BIND_ADDRESS (default: 127.0.0.1)
# ACE_PORT_FLUENT_BIT (default: 24224)
# ACE_PORT_HTTP (default: 8443)
# ACE_PORT_HTTP_EXTERNAL (default: 9443)
# ACE_PORT_GUI (default: 5000)
# ACE_PORT_DEV_GUI (default: 5001)
#

# compose project name (do not set COMPOSE_PROJECT_NAME; see docs/MULTI_INSTANCE.md)
name: ${ACE_INSTANCE:-ace}

x-common-env: &common-env
  PYTHONUTF8: "1"
  LANG: C.UTF-8
  SAQ_ENC: ${SAQ_ENC:-test}
  SAQ_CONFIG_PATHS: ${SAQ_CONFIG_PATHS:-}
  ACE_INSTANCE_TYPE: ${ACE_INSTANCE_TYPE:-DEV} # possible values: DEV, QA, PRODUCTION
  # which instance this is. drives the compose project name (and so the volume names) and, via
  # the env: markers in etc/saq.default.yaml, what the GUI calls itself and where its permalinks
  # point. these two must always be set: etc/saq.default.yaml resolves env:VAR eagerly and a
  # missing variable is a fatal configuration error.
  ACE_INSTANCE: ${ACE_INSTANCE:-ace}
  ACE_INSTANCE_NAME: ${ACE_INSTANCE_NAME:-DEV}
  ACE_GUI_BASE_URI: ${ACE_GUI_BASE_URI:-https://localhost:5000/ACE}
  # if this node is the primary node, set this value to 1, otherwise set it to 0
  # in a standalone deployment, this should be set to 1
  ACE_IS_PRIMARY_NODE: ${ACE_IS_PRIMARY_NODE:-1}
  # if your primary database has a different hostname, you will need to pass it in as ACE_DB_HOST
  ACE_DB_HOST: ${ACE_DB_HOST:-ace-db}
  ACE_DB_READONLY_HOST: ${ACE_DB_READONLY_HOST:-ace-db-readonly}
  ACE_DB_USER_PASSWORD: ${ACE_DB_USER_PASSWORD:-}
  ACE_SUPERUSER_DB_USER_PASSWORD: ${ACE_SUPERUSER_DB_USER_PASSWORD:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  ACE_API_KEY: ${ACE_API_KEY:-}
  FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
  AWS_REGION:

x-common-volumes: &common-volumes
  - .:/opt/ace
  # NOTE your ssh keys are mounted read-only in all containers
  - ~/.ssh:/home/ace/.ssh:ro
  - data:/opt/ace/data
  - sql:/docker-entrypoint-initdb.d
  - sql-readonly:/ace-sql-readonly
  - auth:/auth
  - user-home:/home/ace
  - ./ssl:/opt/ace/ssl
  - phishkit:/phishkit
  - js-deobfuscator:/js-deobfuscator
  - ./signatures:/opt/ace/signatures
  - type: tmpfs
    target: /tmp

services:

  # ensures file permissions on named volumes are correct
  ace-root-volume-initialize:
    platform: linux/amd64
    environment: *common-env
    user: root
    # this runs before fluent-bit (which depends on it), so it cannot ship to the
    # collector. the local driver at least keeps its output bounded and retrievable
    # with docker compose logs.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-docker.io}
        SAQ_USER_ID: ${SAQ_USER_ID:-1000}
        SAQ_GROUP_ID: ${SAQ_GROUP_ID:-1000}
        BUILD_TYPE: ${BUILD_TYPE:-development}
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    command: /bin/bash -c "/opt/ace/docker/startup/initialize_volumes.sh"
    volumes:
      - .:/opt/ace
      - data:/opt/ace/data
      - sql:/docker-entrypoint-initdb.d
      - sql-readonly:/ace-sql-readonly
      - ./ssl:/opt/ace/ssl
      - auth:/auth
      - phishkit:/phishkit
      - js-deobfuscator:/js-deobfuscator
      - ./signatures:/opt/ace/signatures
    networks:
      - ace

  fluent-bit:
    platform: linux/amd64
    environment: *common-env
    image: ${DOCKER_IMAGE_PREFIX:-docker.io}/fluent/fluent-bit:latest
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}:${ACE_PORT_FLUENT_BIT:-24224}:24224"
    restart: unless-stopped
    stop_grace_period: 30s
    # fluent-bit obviously cannot ship its own logs through itself. if the collector is
    # broken this is the only place that says so, so keep a bounded local copy.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    hostname: fluent-bit
    command: /fluent-bin/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.yaml
    depends_on:
      ace-root-volume-initialize:
        condition: service_completed_successfully
    user: ${SAQ_USER_ID:-1000}:${SAQ_GROUP_ID:-1000}
    volumes:
      - ./etc/fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - data:/data
    networks:
      - ace

  # performs all first-time initialization routines that do not require the db
  ace-initialize:
    platform: linux/amd64
    environment: *common-env
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    command: /bin/bash -c "/opt/ace/docker/startup/initialize.sh"
    depends_on:
      ace-root-volume-initialize:
        condition: service_completed_successfully
      # without this ace-initialize races fluent-bit (both depended only on the volume
      # init) and its early output is dropped
      fluent-bit:
        condition: service_started
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: setup
        fluentd-async: "true"
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  ace-db:
    platform: linux/amd64
    image: ${DOCKER_IMAGE_PREFIX:-docker.io}/library/mysql:9.7
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_520_ci --max-allowed-packet=1073741824
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: mysql-db-primary
        fluentd-async: "true"
    healthcheck:
      test: ["CMD", "mysql", "--defaults-file=/docker-entrypoint-initdb.d/mysql_defaults", "-h", "${ACE_DB_HOST:-ace-db}", "-e", "use ace;"]
      interval: 3s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: always
    stop_grace_period: 90s
    depends_on:
      ace-initialize:
        condition: service_completed_successfully
      fluent-bit:
        condition: service_started
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
    volumes:
      - db:/var/lib/mysql
      - sql:/docker-entrypoint-initdb.d
      - data:/opt/ace/data
      - ./etc/mysqld/conf.d:/etc/mysql/conf.d
      - ./ssl:/opt/ace/ssl
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}::3306"
    hostname: ${ACE_DB_HOST:-ace-db}
    networks:
      - ace
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  ace-db-readonly:
    platform: linux/amd64
    image: ${DOCKER_IMAGE_PREFIX:-docker.io}/library/mysql:9.7
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_520_ci --max-allowed-packet=1073741824
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: mysql-db-readonly
        fluentd-async: "true"
    healthcheck:
      test: ["CMD", "mysql", "--defaults-file=/docker-entrypoint-initdb.d/mysql_defaults", "-h", "${ACE_DB_READONLY_HOST:-ace-db-readonly}", "-e", "use ace;"]
      interval: 3s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: always
    stop_grace_period: 90s
    depends_on:
      ace-db:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
    volumes:
      - db-readonly:/var/lib/mysql
      - sql-readonly:/docker-entrypoint-initdb.d
      - data:/opt/ace/data
      - ./etc/mysqld.replica/conf.d:/etc/mysql/conf.d
      - ./ssl:/opt/ace/ssl
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}::3306"
    hostname: ${ACE_DB_READONLY_HOST:-ace-db-readonly}
    networks:
      - ace
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  qdrant:
    platform: linux/amd64
    environment:
      QDRANT__SERVICE__ENABLE_TLS: 1
      QDRANT__TLS__CERT: /ssl/ace.cert.pem
      QDRANT__TLS__KEY: /ssl/ace.key.pem
    image: ${DOCKER_IMAGE_PREFIX:-docker.io}/qdrant/qdrant
    hostname: ${QDRANT_HOSTNAME:-qdrant}
    restart: always
    stop_grace_period: 60s
    entrypoint: >
      /bin/sh -c "
      export QDRANT__SERVICE__API_KEY=$(cat /auth/passwords/qdrant) && exec ./entrypoint.sh
      "
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: qdrant
        fluentd-async: "true"
    depends_on:
      ace-setup:
        condition: service_completed_successfully
      fluent-bit:
        condition: service_started
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}::6333"
    volumes:
      - qdrant:/qdrant/storage
      - ./ssl:/ssl:ro
      - auth:/auth
    networks:
      - ace

  # performs all first-time initialization routines that require the db
  ace-setup:
    platform: linux/amd64
    environment: *common-env
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    command: /bin/bash -c "/opt/ace/docker/startup/setup.sh"
    depends_on:
      ace-db:
        condition: service_healthy
    # setup.sh runs alembic upgrade head against four migration chains on every startup
    # and verifies the encryption password. that is shell and alembic output, not python
    # logging, so it needs the docker driver rather than ACE_LOG_CONFIG_PATH.
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: setup
        fluentd-async: "true"
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  ace-http-external:
    platform: linux/amd64
    image: ${DOCKER_IMAGE_PREFIX:-docker.io}/library/nginx:latest
    restart: always
    stop_grace_period: 30s
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: nginx
        fluentd-async: "true"
    depends_on:
      - http-app
      - http-api
      - http-api-v2
      - http-api-ai
      - fluent-bit
    volumes:
      - ./etc/nginx/conf.d.external:/etc/nginx/conf.d:ro
      - ./app/static:/opt/ace/app/static:ro
      - ./ssl:/opt/ace/ssl:ro
    hostname: ace-http-external
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}:${ACE_PORT_HTTP_EXTERNAL:-9443}:443"
    networks:
      - ace

  ace-http:
    platform: linux/amd64
    image: ${DOCKER_IMAGE_PREFIX:-docker.io}/library/nginx:latest
    restart: always
    stop_grace_period: 30s
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: nginx
        fluentd-async: "true"
    depends_on:
      - http-app
      - http-api
      - http-api-v2
      - http-api-ai
      - fluent-bit
    volumes:
      - ./etc/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app/static:/opt/ace/app/static:ro
      - ./ssl:/opt/ace/ssl:ro
    hostname: ace-http
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}:${ACE_PORT_HTTP:-8443}:443"
    networks:
      - ace

  http-app:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-app
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      - ace
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh uwsgi --yaml etc/uwsgi_app.yaml"
    restart: always
    stop_grace_period: 60s
    volumes: *common-volumes
    hostname: ace
    expose:
      - "3030"
    networks:
      - ace

  http-api:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-api
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      - ace
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh uwsgi --yaml etc/uwsgi_api.yaml"
    restart: always
    stop_grace_period: 60s
    volumes: *common-volumes
    hostname: ace
    expose:
      - "3031"
    networks:
      - ace

  http-api-v2:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-api-v2
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      - ace
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh uvicorn api_uvicorn:application --host 0.0.0.0 --port 3032 --workers 12 --timeout-keep-alive 300 --timeout-graceful-shutdown 45"
    restart: always
    stop_grace_period: 60s
    volumes: *common-volumes
    hostname: ace
    expose:
      - "3032"
    networks:
      - ace

  # The AI investigation API (aceapi_ai): read-only query endpoints for AI-driven alert triage.
  # Deliberately NOT on the common env/volume anchors -- the container's security property is that
  # it holds nothing valuable to the rest of ACE: no SAQ_ENC (the encrypted secrets table is
  # unreadable here even under full compromise), a curated config overlay instead of the dev
  # etc/saq.yaml, read-only mounts, and its own startup checks (aceapi_ai/startup_checks.py) that
  # refuse to boot if any of that is violated.
  http-api-ai:
    platform: linux/amd64
    environment:
      # no SAQ_ENC: this process must not be able to unlock the encryption subsystem
      SAQ_CONFIG_PATHS: etc/saq.ai.yaml
      SAQ_SKIP_LOCAL_SAQ_YAML: "1"
      ACE_INSTANCE_TYPE: ${ACE_INSTANCE_TYPE:-DEV}
      # this container does not use *common-env, but it still loads etc/saq.default.yaml, whose
      # env: markers are fatal when unset -- so these have to be repeated here
      ACE_INSTANCE_NAME: ${ACE_INSTANCE_NAME:-DEV}
      ACE_GUI_BASE_URI: ${ACE_GUI_BASE_URI:-https://localhost:5000/ACE}
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-api-ai
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      - redis
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh uvicorn api_ai_uvicorn:application --host 0.0.0.0 --port 3033 --workers 2 --timeout-keep-alive 300 --timeout-graceful-shutdown 45"
    restart: always
    stop_grace_period: 60s
    volumes:
      - .:/opt/ace
      - data:/opt/ace/data:ro          # alert storage for download -- read-only
      - sql:/docker-entrypoint-initdb.d:ro   # auto-generated database passwords overlay
      - auth:/auth:ro                  # redis password; flask/node keys are neutralized by etc/saq.ai.yaml
      - ./ssl:/opt/ace/ssl:ro
      - type: tmpfs
        target: /tmp
    # same node hostname as the other web containers: the data-dir initialization derives the
    # node directory from it, and data/ace already exists -- so this container never needs write
    # access to the (read-only) data volume
    hostname: ace
    expose:
      - "3033"
    networks:
      - ace

  redis:
    platform: linux/amd64
    image: ${DOCKER_IMAGE_PREFIX:-docker.io}/library/redis:latest
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}::6379"
    restart: always
    stop_grace_period: 30s
    hostname: ${REDIS_HOSTNAME:-redis}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: redis
        fluentd-async: "true"
    depends_on:
      ace-setup:
        condition: service_completed_successfully
      fluent-bit:
        condition: service_started
    # here we're loading the redis.conf that is built from the ace-setup container
    command: ["redis-server", "/auth/etc/redis/redis.conf"]
    volumes:
      - auth:/auth
    networks:
      - ace

  http-debug:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-debug
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      - ace
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace gui start"
    restart: always
    stop_grace_period: 30s
    volumes: *common-volumes
    hostname: ace
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}:${ACE_PORT_GUI:-5000}:5000"
    networks:
      - ace

  network-semaphore:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-network-semaphore
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      ace-setup:
        condition: service_completed_successfully
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace service start network_semaphore"
    restart: always
    stop_grace_period: 45s
    volumes: *common-volumes
    hostname: ace
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}::53559"
    networks:
      - ace

  git:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-git
    depends_on:
      - ace
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace service start git"
    restart: always
    stop_grace_period: 45s
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  cron:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-cron
    depends_on:
      - ace
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace service start cron"
    restart: always
    stop_grace_period: 45s
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  yara:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-yara
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      ace-setup:
        condition: service_completed_successfully
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace service start yara"
    restart: always
    stop_grace_period: 45s
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  search-indexer:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-search-indexer
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      ace:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace service start search_indexer"
    restart: always
    stop_grace_period: 45s
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  remediation:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-remediation
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      ace:
        condition: service_started
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace service start remediation"
    restart: always
    stop_grace_period: 45s
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  external-remediation-check:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-external-remediation-check
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      ace:
        condition: service_started
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace service start external_remediation_check"
    restart: always
    stop_grace_period: 45s
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  monitoring:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-monitoring
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      ace:
        condition: service_started
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace service start monitoring"
    restart: always
    stop_grace_period: 45s
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  # this is the service you will attach to for development purposes
  dev:
    platform: linux/amd64
    environment: *common-env
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    #depends_on:
      #ace-setup:
        #condition: service_completed_successfully
    command: /bin/bash -c "/opt/ace/docker/startup/start_nothing.sh"
    restart: always
    stop_grace_period: 10s
    volumes: *common-volumes
    hostname: ace
    cap_add:
      - SYS_PTRACE
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}:${ACE_PORT_DEV_GUI:-5001}:5000"
    networks:
      - ace

  ace:
    platform: linux/amd64
    environment:
      <<: *common-env
      ACE_LOG_CONFIG_PATH: etc/logging_configs/ace_logging.yaml
      FLUENT_BIT_TAG: ace-engine
    image: ${ACE3_IMAGE_URL:-ace3:latest}
    depends_on:
      ace-setup:
        condition: service_completed_successfully
      yara:
        condition: service_started
      network-semaphore:
        condition: service_started
      phishkit:
        condition: service_started
      js-deobfuscator:
        condition: service_started
      qdrant:
        condition: service_started
    command: /bin/bash -c "/opt/ace/docker/startup/start.sh ace service start engine"
    restart: always
    stop_grace_period: 120s
    init: true
    volumes: *common-volumes
    hostname: ace
    networks:
      - ace

  rabbitmq:
    platform: linux/amd64
    environment:
      RABBITMQ_DEFAULT_USER: "ace3"
    image: ${DOCKER_IMAGE_PREFIX:-docker.io}/library/rabbitmq
    ports:
      - "${ACE_BIND_ADDRESS:-127.0.0.1}::5672"
    restart: always
    stop_grace_period: 60s
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    entrypoint: >
      /bin/sh -c "
      export RABBITMQ_DEFAULT_PASS=$(cat /auth/passwords/rabbitmq);
      exec rabbitmq-server
      "
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: rabbitmq
        fluentd-async: "true"
    depends_on:
      ace-setup:
        condition: service_completed_successfully
      fluent-bit:
        condition: service_started
    volumes:
      - ./etc/rabbitmq/conf.d/20-logging.conf:/etc/rabbitmq/conf.d/20-logging.conf:ro
      - ./etc/rabbitmq/conf.d/30-deprecated-features.conf:/etc/rabbitmq/conf.d/30-deprecated-features.conf:ro
      - auth:/auth
    networks:
      - ace

  phishkit-init:
    platform: linux/amd64
    build:
      context: .
      dockerfile: phishkit/Dockerfile.phishkit
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-docker.io}
    image: ${ACE3_PHISHKIT_IMAGE_URL:-phishkit:latest}
    # this is here just to build the image
    entrypoint: /bin/true

  phishkit:
    platform: linux/amd64
    environment:
      ACE3_PHISHKIT_IMAGE_URL: ${ACE3_PHISHKIT_IMAGE_URL:-phishkit:latest}
      # this container shells out to `docker run` on the host daemon, so it has to be told the
      # real (project-prefixed) name of the volume it shares with the scanners it spawns, and
      # which instance it belongs to so its reaper only kills its own containers
      ACE_INSTANCE: ${ACE_INSTANCE:-ace}
      ACE_PHISHKIT_VOLUME: ${ACE_INSTANCE:-ace}_phishkit
    hostname: phishkit
    build:
      context: .
      dockerfile: phishkit/Dockerfile
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-docker.io}
    image: ${ACE3_PHISHKIT_MANAGER_IMAGE_URL:-phishkit-manager:latest}
    restart: always
    stop_grace_period: 60s
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: phishkit
        fluentd-async: "true"
    depends_on:
      phishkit-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    volumes:
      # this is needed so that this container can create other containers
      - /var/run/docker.sock:/var/run/docker.sock
      # this volume is used to share the downloaded data between the child containers and this one
      - phishkit:/phishkit
      # this volume contains authentication information
      - auth:/auth
      - ./etc:/opt/ace/etc:ro
      # signatures volume so phishkit manager can read analyst-data config files
      - ./signatures:/opt/ace/signatures:ro
    networks:
      - ace

  js-deobfuscator-init:
    platform: linux/amd64
    build:
      context: .
      dockerfile: js_deobfuscator/Dockerfile.js_deobfuscator
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-docker.io}
    image: ${ACE3_JS_DEOBFUSCATOR_IMAGE_URL:-js-deobfuscator:latest}
    # this is here just to build the scanner image
    entrypoint: /bin/true

  js-deobfuscator:
    platform: linux/amd64
    environment:
      ACE3_JS_DEOBFUSCATOR_IMAGE_URL: ${ACE3_JS_DEOBFUSCATOR_IMAGE_URL:-js-deobfuscator:latest}
      # as with phishkit: spawns sibling containers, so it needs the real volume name
      ACE_INSTANCE: ${ACE_INSTANCE:-ace}
      ACE_JS_DEOBFUSCATOR_VOLUME: ${ACE_INSTANCE:-ace}_js-deobfuscator
    hostname: js-deobfuscator
    build:
      context: .
      dockerfile: js_deobfuscator/Dockerfile
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-docker.io}
    image: ${ACE3_JS_DEOBFUSCATOR_MANAGER_IMAGE_URL:-js-deobfuscator-manager:latest}
    restart: always
    stop_grace_period: 60s
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:${ACE_PORT_FLUENT_BIT:-24224}
        tag: js-deobfuscator
        fluentd-async: "true"
    depends_on:
      js-deobfuscator-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    volumes:
      # needed so this container can spawn sibling scanner containers
      - /var/run/docker.sock:/var/run/docker.sock
      # shared volume for passing input files and returning output
      - js-deobfuscator:/js-deobfuscator
      - auth:/auth
    networks:
      - ace

volumes:
  data:
  db:
  db-readonly:
  sql:
  sql-readonly:
  phishkit:
  js-deobfuscator:
  auth:
  qdrant:
  user-home:

networks:
  ace:
