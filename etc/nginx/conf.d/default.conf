server {
    listen 443 ssl default_server;
    server_name ace-http localhost;
    ssl_certificate /opt/ace/ssl/ace.cert.pem;
    ssl_certificate_key /opt/ace/ssl/ace.key.pem;
    client_max_body_size 0;

    # compress responses
    gzip on;
    gzip_types text/css text/plain application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    location /ace {
        include uwsgi_params;
        uwsgi_pass http-app:3030;
        uwsgi_read_timeout 300s;
    }

    location /api/v2 {
        proxy_pass http://http-api-v2:3032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 0;
    }

    location /api {
        include uwsgi_params;
        uwsgi_pass http-api:3031;
        uwsgi_read_timeout 300s;
        uwsgi_max_temp_file_size 0;
    }

    # the AI investigation API (its own container; the isolation is the process boundary and the
    # key scoping, not the route)
    location /ai/v1 {
        proxy_pass http://http-api-ai:3033;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 700s;
        proxy_connect_timeout 75s;
        client_max_body_size 0;
    }

    location /ace/static {
        alias /opt/ace/app/static;
    }
}
