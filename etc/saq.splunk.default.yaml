api_query_defaults_default:
  name: default
  wide_duration_before: "01:00:00:00"
  wide_duration_after: "01:00:00:00"
  narrow_duration_before: "00:01:00:00"
  narrow_duration_after: "00:01:00:00"
  max_result_count: 1000
  query_timeout: 300
  # how long to wait between calls to check for status of an async query
  async_delay: 1
  use_index_time: true
  
splunk_config_default:
  name: default
  # are we using this splunk server?
  enabled: true
  # the splunk query server
  host: localhost
  port: 443
  # user account information for splunk
  username:
  password:
  # (optiona) use token authentication instead of username/password
  token:
  timezone: GMT
  # directory that contains splunk query performance data
  # leave this empty to disable
  # relative to DATA_DIR
  performance_logging_dir: splunk_perf
  # default app and user context to use if not specified
  user_context:
  app_context:

# exports the observables enabled for detection into a splunk kv store collection, so they can be
# used as a lookup. 
observable_export_splunk:
  name: splunk
  python_module: saq.observables.export.splunk_kvstore
  python_class: SplunkKVStoreExport
  description: Exports observables enabled for detection to a Splunk KV store collection.
  # off by default: splunk_config_default points at localhost with no credentials, so a stock
  # install has nothing to publish to. set `collection` and enable this where splunk is configured.
  enabled: false
  # the kv store collection to publish into
  collection: ""
  # the observable types to export
  # NOTE: these map directly to observable type string representations!
  export_list:
    - email_address
    - email_subject
    - email_x_mailer
    - file_name
    - fqdn
    - ip
    # legacy: detections created before the migration to the generic `ip` type still carry `ipv4`
    - ipv4
    - uri_path
    - url
    - user_agent
    - md5
    - sha256
  # how many documents to send per batch save request
  max_export: 500
  # which splunk_config_<name> block to connect through
  api: default
  # only used when the splunk config named above leaves them unset -- it wins when it sets them
  user_context:
  app:

service_network_semaphore:
  semaphore_capacity_limits:
    splunk: 1

hunt_type_splunk:
  name: splunk
  python_module: saq.collectors.hunter.splunk_hunter
  python_class: SplunkHunt
  rule_dirs: []
  update_frequency: 60

config:
  splunk_modules: etc/saq.splunk_modules.yaml
