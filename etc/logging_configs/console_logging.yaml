version: 1
disable_existing_loggers: false

formatters:
  base:
    # ExtraAwareTextFormatter appends any extra={} keys to the line as
    # key=value tokens. Call sites put fields in extra={} only, so without
    # this the fields would be visible on the fluent/Splunk path alone.
    '()': saq.logging.ExtraAwareTextFormatter
    format: ' [%(levelname)s] %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: base
    stream: ext://sys.stderr
  file:
    class: logging.FileHandler
    level: INFO
    formatter: base
    filename: data/logs/console.log
    mode: a

loggers:
  '': # root logger
    handlers: [console, file]
    level: DEBUG
    propagate: false
