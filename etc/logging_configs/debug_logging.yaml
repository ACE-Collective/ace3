version: 1
disable_existing_loggers: false

formatters:
  base:
    # ExtraAwareTextFormatter appends any extra={} keys to the line as
    # key=value tokens. Call sites put fields in extra={} only, so without
    # this the fields would be visible on the fluent/Splunk path alone.
    '()': saq.logging.ExtraAwareTextFormatter
    format: '[%(asctime)s] [%(name)s] [%(pathname)s:%(funcName)s:%(lineno)d] [%(threadName)s] [%(process)d] [%(levelname)s] - %(message)s'
  fluent_fmt:
    # matches ace_logging.yaml -- the stock FluentRecordFormatter drops every
    # extra={} field, which would make dev output differ from production
    '()': saq.logging.ExtraAwareFluentFormatter
    format:
      asctime: '%(asctime)s'
      filename: '%(filename)s'
      lineno: '%(lineno)d'
      threadName: '%(threadName)s'
      process: '%(process)d'
      severity: '%(levelname)s'
      message: '%(message)s'
      logSource: '%(name)s'
      transactionId: '%(transactionId)s'

handlers:
  console:
    class: ansistrm.ColorizingStreamHandler
    level: DEBUG
    formatter: base
    stream: ext://sys.stderr
  fluent:
    class: fluent.handler.FluentHandler
    host: fluent-bit
    port: 24224
    # NOTE this gets overridden by the FLUENT_BIT_TAG environment variable
    tag: ace-debug
    #buffer_overflow_handler: TBD
    nanosecond_precision: true
    formatter: fluent_fmt
    level: DEBUG

loggers:
  '': # root logger
    handlers: [console, fluent]
    level: DEBUG
    propagate: false
