# A flaw in ACE's design that a change had to work around; see README.md in this directory.
title: No guarded API for writing a root file from an untrusted name
status: deferred
area: analysis tree / file manager
fix_size: medium
flaw: 'Analysis modules compute their own output paths under root.file_dir with os.path.join(..., name_from_content)
  and write with open() (xml.py _XMLParser, rfc822 attachments, archive extractors writing via external
  tools), and only later hand the path to add_file_observable/store_file. The file manager therefore sees
  a hostile name only after the bytes are written. Each source sanitizes names in its own way: saq.util.filesystem.safe_file_name,
  safe_filename (xml), rfc822''s inline regex, werkzeug secure_filename (GUI temp copy), aceapi_v2.common.archive.safe_file_name.'
fix: One file-manager entry point, e.g. root.create_output_file(name) -> open handle/path, that sanitizes
  or refuses the name before any write and uniquifies collisions. Move the extractors and rfc822 to it,
  and drop the per-module sanitizers.
first_seen: '2026-10-22'
workarounds:
- repo: ace
  branch: jd/fix-upload-path-traversal
  round: 1
  file: saq/modules/file_analysis/xml.py
  line: 144
  what: 'Adds a containment check to create_file_path/store_file (after the fact for direct writers),
    then patches each entry point separately: xml.py lstrip(''/''), safe_file_name in the hunt extraction
    and the GUI upload, and the API v2 drops the observable''s file_path.'
  seen: '2026-10-22'
decided: '2026-10-22'
