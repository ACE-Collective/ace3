# A flaw in ACE's design that a change had to work around; see README.md in this directory.
title: 'Analysis-to-module mapping needs an instance: generated_analysis_type is a property'
status: deferred
area: analysis modules / configuration
fix_size: medium
flaw: 'A module path (saq/analysis/module_path.py) names the generated Analysis class, while config names
  the module class (python_class). The only link between them is AnalysisModule.generated_analysis_type,
  an instance property defined in ~126 module classes (saq/modules/**), so no code can map an analysis
  back to its module or config without constructing the module, whose __init__ may create directories
  or open clients. Nothing persisted or declared at class level records which config generated an analysis.
  (Also reported by the logging and uptime reviewers; the uptime angle: a saved Analysis does not persist
  which module config generated it.)'
fix: Make the generated Analysis type a class-level declaration (e.g. a `generated_analysis_type` class
  attribute or classmethod on AnalysisModule, keeping the property as a reader of it), migrate the ~126
  overrides mechanically, and look it up on the class; optionally record the module config name on the
  Analysis when it is created so the GUI reads it directly.
first_seen: '2026-10-22'
workarounds:
- repo: ace
  branch: jd/fix-module-config-by-class
  round: 1
  file: saq/configuration/schema.py
  line: 1297
  what: get_analysis_module_config_by_module_path() imports each candidate module class and reads generated_analysis_type
    from module_class.__new__(module_class), an instance whose __init__ never ran, relying on every property
    returning a class constant; a new test (test_every_analysis_module_config_is_found_by_its_module_path)
    pins that assumption for every enabled module, and a module that violates it is logged and skipped.
  seen: '2026-10-22'
decided: '2026-10-22'
