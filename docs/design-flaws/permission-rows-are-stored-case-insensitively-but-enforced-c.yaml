# A flaw in ACE's design that a change had to work around; see README.md in this directory.
title: Permission rows are stored case-insensitively but enforced case-sensitively
status: deferred
area: permissions / auth tables
fix_size: medium
flaw: The major/minor columns of auth_permission_catalog, auth_user_permission, auth_group_permission
  and auth_api_key_permission use collation ascii_general_ci (saq/database/model.py:3676-3751), and their
  unique indexes (u_perm, u_user_perm, u_group_perm, u_api_key_perm) treat 'Signature:read' and 'signature:read'
  as the same row. Enforcement uses fnmatchcase (saq/permissions/logic.py:16, :81), which treats them
  as different patterns, and the variant matches nothing. Storage and enforcement disagree about what
  a permission is, so any write path that accepts two case variants of one pattern gets an IntegrityError
  (a 500), and a case variant that is stored allows nothing.
fix: Pick one meaning for case. Either give the permission columns a binary collation (ascii_bin) through
  an autogenerated migration (these tables are tiny, and a ci unique index guarantees no existing case
  duplicates, so the change is safe), or lowercase major/minor on every write and match with fnmatch on
  lowercased values. Then the case-folding in _validate_api_key_scope can go, and the grant paths are
  fixed with it.
first_seen: '2026-10-22'
workarounds:
- repo: ace
  branch: mw/self-service-api-keys
  round: 1
  file: aceapi_v2/users/service.py
  line: 508
  what: _validate_api_key_scope case-folds every scope pattern, stores exact repeats once and refuses
    case variants with a 400 because u_api_key_perm would reject them. The SESSION_ONLY_PAIRS refusal
    is also case-folded ('user:self in any case') even though enforcement would never match a variant.
    The grant tables keep the same mismatch with no such guard.
  seen: '2026-10-22'
decided: '2026-10-22'
