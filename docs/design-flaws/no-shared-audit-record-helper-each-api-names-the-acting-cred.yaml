# A flaw in ACE's design that a change had to work around; see README.md in this directory.
title: No shared AUDIT record helper; each API names the acting credential its own way
status: deferred
area: aceapi_v2 audit logging
fix_size: medium
flaw: 'ACE has no common way to write an AUDIT log record for an API action, so each subsystem writes
  its own record with its own field names for the actor: aceapi_v2/hunt/audit.py::write_audit_record (user,
  user_id, key_id, key_name, src_ip, on the ace.hunt_audit logger), saq/svs/association.py::_audit (actor,
  actor_user_id), saq/svs/hosts.py::_audit_extra (actor only), aceapi_v2/remediation/router.py (auth_name
  in the message only, no extra), and aceapi_v2/users/service.py before this change (actor_id only). An
  operator can''t search one Splunk field for everything a given user or API key did.'
fix: 'One function (e.g. in saq/logging.py or aceapi_v2/auth) that takes an ApiAuthResult plus event fields
  and emits an INFO ''AUDIT: ...'' record with fixed extra keys (actor, actor_user_id, actor_key_id, actor_key_name,
  auth_type); move the hunt, svs, remediation and users callers onto it.'
first_seen: '2026-10-22'
workarounds:
- repo: ace
  branch: mw/self-service-api-keys
  round: 1
  file: aceapi_v2/users/service.py
  line: 539
  what: Adds another private helper, _audit_actor(), which turns an ApiAuthResult into {'actor', 'actor_id',
    'actor_key_id'} for the users service's AUDIT records, a fourth naming of the same fields (key_id
    in hunt, actor_user_id in svs).
  seen: '2026-10-22'
decided: '2026-10-22'
