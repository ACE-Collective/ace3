<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Inter, Arial, sans-serif" font-size="13" fill="#212529">
  <title>SVS attribution and routing: from a marker in an alert to its status, queue and disposition</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- row 1: finding and judging markers -->
  <rect x="15" y="20" width="310" height="80" rx="6" fill="#f4f5f7" stroke="#8a9099"/>
  <text x="170" y="43" text-anchor="middle" font-weight="600">1. Gate: attribution_open()</text>
  <text x="170" y="64" text-anchor="middle">is any run created, or inside its</text>
  <text x="170" y="83" text-anchor="middle">attribution window? (cached per process)</text>

  <rect x="345" y="20" width="310" height="80" rx="6" fill="#e8f0f9" stroke="#6a8db8"/>
  <text x="500" y="43" text-anchor="middle" font-weight="600">2. Find markers: tree_sightings()</text>
  <text x="500" y="64" text-anchor="middle">observables, file names, detections, details;</text>
  <text x="500" y="83" text-anchor="middle">svs_sightings: module output, SVS_Marker</text>

  <rect x="675" y="20" width="310" height="80" rx="6" fill="#e8f0f9" stroke="#6a8db8"/>
  <text x="830" y="43" text-anchor="middle" font-weight="600">3. Judge each marker</text>
  <text x="830" y="64" text-anchor="middle">resolve_markers(), then attributed,</text>
  <text x="830" y="83" text-anchor="middle">unknown, other host or outside window</text>

  <line x1="325" y1="60" x2="343" y2="60" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="60" x2="673" y2="60" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 2: the three outcomes of evaluate() -->
  <line x1="830" y1="100" x2="170" y2="168" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="830" y1="100" x2="500" y2="168" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="830" y1="100" x2="830" y2="168" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="15" y="170" width="310" height="80" rx="6" fill="#f9ecec" stroke="#b86a6a"/>
  <text x="170" y="193" text-anchor="middle" font-weight="600">A marker disagrees: mismatch</text>
  <text x="170" y="214" text-anchor="middle">nothing is attributed, and the context</text>
  <text x="170" y="233" text-anchor="middle">fallback never runs (FR-3)</text>

  <rect x="345" y="170" width="310" height="80" rx="6" fill="#edf5ee" stroke="#7fa886"/>
  <text x="500" y="193" text-anchor="middle" font-weight="600">Markers agree: same-branch rule</text>
  <text x="500" y="214" text-anchor="middle">detections on each marker's branch,</text>
  <text x="500" y="233" text-anchor="middle">confidence marker</text>

  <rect x="675" y="170" width="310" height="80" rx="6" fill="#fbf3e8" stroke="#c99a5b"/>
  <text x="830" y="193" text-anchor="middle" font-weight="600">No marker at all: context</text>
  <text x="830" y="214" text-anchor="middle">exactly one run's target and window:</text>
  <text x="830" y="233" text-anchor="middle">every detection, confidence context</text>

  <!-- into write_attributions -->
  <line x1="120" y1="250" x2="120" y2="338" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="250" x2="220" y2="338" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="830" y1="250" x2="300" y2="338" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 3: writing and routing -->
  <rect x="15" y="340" width="310" height="80" rx="6" fill="#f2eef7" stroke="#957bb0"/>
  <text x="170" y="363" text-anchor="middle" font-weight="600">4. write_attributions()</text>
  <text x="170" y="384" text-anchor="middle">svs_attributions in its own transaction;</text>
  <text x="170" y="403" text-anchor="middle">never a row a person wrote or removed</text>

  <rect x="345" y="340" width="310" height="80" rx="6" fill="#e8f0f9" stroke="#6a8db8"/>
  <text x="500" y="363" text-anchor="middle" font-weight="600">5. MarkerRouter decision</text>
  <text x="500" y="384" text-anchor="middle">held (svs_manual), routed to svs.queue,</text>
  <text x="500" y="403" text-anchor="middle">moved back, or none</text>

  <rect x="675" y="340" width="310" height="80" rx="6" fill="#e8f0f9" stroke="#6a8db8"/>
  <text x="830" y="363" text-anchor="middle" font-weight="600">6. The queue</text>
  <text x="830" y="384" text-anchor="middle">PRE_INSERT: ALERT() sets it;</text>
  <text x="830" y="403" text-anchor="middle">POST_ANALYSIS: move_alert_to_queue()</text>

  <line x1="325" y1="380" x2="343" y2="380" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="380" x2="673" y2="380" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 4: what follows -->
  <line x1="170" y1="420" x2="170" y2="488" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="15" y="490" width="310" height="80" rx="6" fill="#f4f5f7" stroke="#8a9099"/>
  <text x="170" y="513" text-anchor="middle" font-weight="600">Status, derived on read</text>
  <text x="170" y="534" text-anchor="middle">alert_status.py: test, test?, partial,</text>
  <text x="170" y="553" text-anchor="middle">mismatch (from the rows and the tag)</text>

  <line x1="325" y1="530" x2="343" y2="530" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="345" y="490" width="310" height="80" rx="6" fill="#edf5ee" stroke="#7fa886"/>
  <text x="500" y="513" text-anchor="middle" font-weight="600">Run reviewed or closed</text>
  <text x="500" y="534" text-anchor="middle">fully attributed open alerts become</text>
  <text x="500" y="553" text-anchor="middle">SIMULATED (runs.close_run_alerts)</text>

  <rect x="675" y="490" width="310" height="80" rx="6" fill="#fbf3e8" stroke="#c99a5b"/>
  <text x="830" y="513" text-anchor="middle" font-weight="600">By hand: association.py</text>
  <text x="830" y="534" text-anchor="middle">associate, disassociate, not a test,</text>
  <text x="830" y="553" text-anchor="middle">keep; moves recorded as svs_manual</text>

  <rect x="15" y="590" width="970" height="40" rx="6" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="500" y="615" text-anchor="middle">In the same pass, before POST_ANALYSIS, svs_alert_tagger runs evaluate() too and changes the tree: svs_test, svs:marker_mismatch</text>
</svg>
