<div class="panel-heading">
    <h3 class="panel-title">Screenshots <a role="button" data-toggle="collapse" data-target="#collapseScreenshots" aria-expanded="true" aria-controls="collapseScreenshots">(hide/show)</a></h3>
</div>
<div class="panel-body collapse in" id="collapseScreenshots">
    {% for screenshot in screenshots %}
    <img width="{{screenshot['scaled_width']}}" height="{{screenshot['scaled_height']}}" src="/api/v2/alerts/{{ screenshot['alert_id'] }}/observables/{{ screenshot['observable_id'] }}/image" class="img-thumbnail" />
    {% endfor %}
</div>
