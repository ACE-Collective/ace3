{# Keep, Remove and Reopen on worklist rows (svs_worklist.js fills in the title, the rows and the
   button). Keep and Remove ask why, and Remove for the pull request dropping the tag; Reopen only
   asks first. Included only with svs:run_manage. #}
<div class="modal fade" id="svs_worklist_resolve_modal" tabindex="-1" role="dialog" aria-hidden="true">
    <form id="svs_worklist_resolve_form">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="svs_worklist_resolve_title"></h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="svs_worklist_resolve_text" class="mb-2"></div>
                <ul id="svs_worklist_resolve_rows" class="small mb-2"></ul>
                <div id="svs_worklist_resolve_fields">
                    <div class="mb-2">
                        <label class="form-label" for="svs_worklist_resolve_reason">Reason</label>
                        <textarea class="form-control" id="svs_worklist_resolve_reason" name="reason" rows="3" maxlength="4096"></textarea>
                    </div>
                    <div>
                        <label class="form-label" for="svs_worklist_resolve_reference">Reference</label>
                        <input type="url" class="form-control" id="svs_worklist_resolve_reference" name="reference" maxlength="1024" placeholder="https://">
                        <div id="svs_worklist_resolve_reference_hint" class="form-text"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-outline-primary" id="svs_worklist_resolve_submit"></button>
            </div>
        </div>
    </div>
    </form>
</div>
