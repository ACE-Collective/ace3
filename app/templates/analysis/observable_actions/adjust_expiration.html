{% set detection = observable_detections[_observable.uuid] %}
<script type="text/javascript">
    $('#action_{{action.name}}_{{unique_reference}}').on('click', function() {
        show_detection_expiration_modal_for(
            {{ detection.detection_id }},
            {{ (detection.expires_on.strftime('%Y-%m-%d %H:%M:%S') if detection.expires_on else none) | tojson }});
    });
</script>
