{% set expiration = action.default_expiration(_observable.type) %}
<script type="text/javascript">
    $('#action_{{action.name}}_{{unique_reference}}').on('click', function() {
        show_enable_detection_modal_for({
            type: {{ _observable.type | tojson }},
            value: {{ _observable.value | tojson }},
            detection_context: {{ ("manually enabled in the gui by " ~ current_user.username ~ " for alert " ~ alert.description ~ " (" ~ alert.uuid ~ ")") | tojson }}
        }, {{ (expiration.strftime('%Y-%m-%d %H:%M:%S') if expiration else none) | tojson }});
    });
</script>
