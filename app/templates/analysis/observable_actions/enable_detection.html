<script type="text/javascript">
    $('#action_{{action.name}}_{{unique_reference}}').on('click', function() {
        if (! confirm("Are you sure you want to enable this observable for detection?")) { return; }
        aceApi.post("/detection/", {
            type: {{ _observable.type | tojson }},
            value: {{ _observable.value | tojson }},
            detection_context: {{ ("manually enabled in the gui by " ~ current_user.username ~ " for alert " ~ alert.description ~ " (" ~ alert.uuid ~ ")") | tojson }}
        }).then(function() {
            window.location = {{ url_for('analysis.index', direct=alert.uuid) | tojson }};
        }).catch(function(error) {
            alert(error.message);
        });
    });
</script>
