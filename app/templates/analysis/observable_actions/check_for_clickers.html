<script type="text/javascript">
    $('#action_{{action.name}}_{{unique_reference}}').on('click', function() {
        if (! confirm("Check log sources for anyone who clicked this URL / visited this domain?")) { return; }
        request_observable_analysis("{{alert.uuid}}", "{{_observable.uuid}}", "check-for-clickers", "{{url_for('analysis.index', direct=alert.uuid)}}");
    });
</script>
