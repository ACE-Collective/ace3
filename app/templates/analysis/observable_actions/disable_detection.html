{% set detection = observable_detections[_observable.uuid] %}
<script type="text/javascript">
    $('#action_{{action.name}}_{{unique_reference}}').on('click', function() {
        if (! confirm("Are you sure you want to disable this observable for detection?")) { return; }
        aceApi.del("/detection/{{ detection.detection_id }}").then(function() {
            window.location = {{ url_for('analysis.index', direct=alert.uuid) | tojson }};
        }).catch(function(error) {
            alert(error.message);
        });
    });
</script>
