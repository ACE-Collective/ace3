<script type="text/javascript">
    $('#action_{{action.name}}_{{unique_reference}}').on('click', function() {
        aceApi.get("/alerts/{{alert.uuid}}/observables/{{_observable.uuid}}/clicker-searches")
            .then(function(result) {
                if (result.data.length === 0) {
                    alert("No Splunk clicker search is configured for this observable type.");
                    return;
                }
                result.data.forEach(function(search) { window.open(search.url, '_blank', 'noopener'); });
            })
            .catch(function(err) { alert("Unable to build the Splunk search: " + err.message); });
    });
</script>
